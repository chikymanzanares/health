{% extends "base.html" %}
{% block title %}Login · Health Claims{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Demo users: <code>juanjo</code> / <code>juanjo01</code>, <code>tom</code> / <code>tom01</code></p>
  <form method="post" action="{{ url_for('login') }}" class="stack">
    <label>
      Username
      <input name="username" autocomplete="username" required />
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <button type="submit">Login</button>
  </form>
</section>
{% endblock %}
