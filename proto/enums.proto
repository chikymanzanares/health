syntax = "proto3";

package insurance;

// Shared enums for the insurance claim domain.

enum ClaimType {
  CLAIM_TYPE_UNSPECIFIED = 0;
  CLAIM_TYPE_MEDICAL_EXPENSE = 1;
  CLAIM_TYPE_PHARMACY = 2;
  CLAIM_TYPE_DENTAL = 3;
}

enum ClaimStatus {
  CLAIM_STATUS_UNSPECIFIED = 0;
  CLAIM_STATUS_ADJUDICATED = 1;
  CLAIM_STATUS_DENIED = 2;
}

enum EligibilityStatus {
  ELIGIBILITY_STATUS_UNSPECIFIED = 0;
  ELIGIBILITY_STATUS_ACTIVE = 1;
  ELIGIBILITY_STATUS_INACTIVE = 2;
  ELIGIBILITY_STATUS_UNKNOWN = 3;
}

enum AuthorizationDecision {
  AUTHORIZATION_DECISION_UNSPECIFIED = 0;
  AUTHORIZATION_DECISION_APPROVED = 1;
  AUTHORIZATION_DECISION_DENIED = 2;
  AUTHORIZATION_DECISION_NOT_REQUIRED = 3;
}
